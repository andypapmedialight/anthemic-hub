<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DNA replication — 3D</title>
  <link rel="stylesheet" href="/biology/sim.css" />
</head>
<body class="sim">
  <div class="sim-chrome">
    <a href="/biology/">All sims</a>
    <p id="gpu-status" role="status"></p>
  </div>
  <nav class="sim-controls" aria-label="Playback">
    <button type="button" data-code="ArrowLeft">Back</button>
    <button type="button" data-code="ArrowRight">Forward</button>
    <button type="button" data-code="Space">Pause</button>
    <button type="button" data-code="KeyF">Follow</button>
    <button type="button" data-code="KeyL">Legend</button>
    <button type="button" data-code="KeyI">Info</button>
  </nav>
  <script type="module" src="/biology/controls.js"></script>
  <script type="module" src="./boot.js"></script>
</body>
</html>
