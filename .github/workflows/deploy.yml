name: Deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-anthemic-hub
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate economics static assets
        run: node scripts/check-economics.js

      - name: Generate gallery thumbnails
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/generate-gallery-thumbs.py

      - name: Stamp macro.js SRI for production
        run: node scripts/stamp-economics-sri.js

      - name: Stamp hub and bass JS SRI for production
        run: node scripts/stamp-static-sri.js

      - name: Cache-bust static assets
        run: |
          VER="$(git rev-parse --short=12 HEAD)"
          sed -i "s|/assets/css/hub\\.css[^\"']*|/assets/css/hub.css?v=${VER}|g" index.html
          sed -i "s|/assets/js/theme-init\\.js[^\"']*|/assets/js/theme-init.js?v=${VER}|g" index.html
          sed -i "s|/assets/js/hub\\.js[^\"']*|/assets/js/hub.js?v=${VER}|g" index.html
          sed -i "s|/assets/js/hub-nav\\.js[^\"']*|/assets/js/hub-nav.js?v=${VER}|g" index.html
          sed -i "s|/assets/js/hub-console\\.js[^\"']*|/assets/js/hub-console.js?v=${VER}|g" index.html
          sed -i "s|/bass/site\\.css[^\"']*|/bass/site.css?v=${VER}|g" bass/index.html
          sed -i "s|macro\\.css[^\"']*|macro.css?v=${VER}|g" economics/index.html
          sed -i "s|/hire/pitch\\.css[^\"']*|/hire/pitch.css?v=${VER}|g" hire/index.html
          sed -i "s|/hire/pitch\\.js[^\"']*|/hire/pitch.js?v=${VER}|g" hire/index.html

      - name: Write bass/papaweb.config.js (public contact endpoint only)
        run: |
          node <<'NODE'
          const fs = require('fs');
          const o = { CONTACT_FORM_ENDPOINT: '/bass/api/contact' };
          const body =
            '/* Generated in CI — no secrets here; Slack webhook is server-side only. */\n' +
            'globalThis.PAPAWEB_CONTACT_SECRETS = ' +
            JSON.stringify(o) +
            ';\n';
          fs.writeFileSync('bass/papaweb.config.js', body);
          NODE

      - name: Stage contact API + server env (not in public web root)
        env:
          PAPAWEB_SLACK_WEBHOOK: ${{ secrets.PAPAWEB_SLACK_WEBHOOK }}
          CONTACT_ADMIN_TOKEN: ${{ secrets.CONTACT_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p incoming-hub/contact incoming-hub/private
          cp bass/contact-backend/server.mjs incoming-hub/contact/
          cp scripts/droplet/papaweb-contact.service incoming-hub/contact/
          {
            echo 'CONTACT_CORS_ORIGIN=https://anthemic-developments.com,https://www.anthemic-developments.com'
            if [[ -n "${PAPAWEB_SLACK_WEBHOOK:-}" ]]; then
              printf 'SLACK_WEBHOOK_URL=%s\n' "${PAPAWEB_SLACK_WEBHOOK}"
            fi
            if [[ -n "${CONTACT_ADMIN_TOKEN:-}" ]]; then
              printf 'CONTACT_ADMIN_TOKEN=%s\n' "${CONTACT_ADMIN_TOKEN}"
            fi
          } > incoming-hub/private/contact.env
          chmod 600 incoming-hub/private/contact.env

      - name: Verify deploy bundle has no public secrets (after staging)
        run: node scripts/check-deploy-secrets.js

      - name: Write Morning Macro API keys (private staging only, not under economics/)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ABS_INDICATOR_API_KEY: ${{ secrets.ABS_INDICATOR_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p incoming-hub/private
          fred="${FRED_API_KEY:-}"
          fred="${fred//$'\r'/}"
          fred="${fred//$'\n'/}"
          if [[ -n "${fred}" ]]; then
            printf '%s\n' "${fred}" > incoming-hub/private/fred-api-key
            chmod 600 incoming-hub/private/fred-api-key
          else
            rm -f incoming-hub/private/fred-api-key
          fi
          abs="${ABS_INDICATOR_API_KEY:-}"
          abs="${abs//$'\r'/}"
          abs="${abs//$'\n'/}"
          if [[ -n "${abs}" ]]; then
            printf '%s\n' "${abs}" > incoming-hub/private/abs-indicator-api-key
            chmod 600 incoming-hub/private/abs-indicator-api-key
          else
            rm -f incoming-hub/private/abs-indicator-api-key
          fi

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload to Droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          RSYNC_SSH="ssh -p ${DEPLOY_PORT}"
          DEST="${DEPLOY_USER}@${DEPLOY_HOST}:incoming-hub/"
          # One rsync per tree: avoids multi-source quirks; trailing slash on ./bass/ copies directory contents into incoming-hub/bass/.
          rsync -avz -e "${RSYNC_SSH}" ./index.html "${DEST}"
          rsync -avz -e "${RSYNC_SSH}" ./bass/ "${DEST}bass/"
          rsync -avz -e "${RSYNC_SSH}" ./brain/ "${DEST}brain/"
          rsync -avz -e "${RSYNC_SSH}" ./hire/ "${DEST}hire/"
          rsync -avz -e "${RSYNC_SSH}" ./gigs/ "${DEST}gigs/"
          rsync -avz -e "${RSYNC_SSH}" ./anth-dev-ad/ "${DEST}anth-dev-ad/"
          rsync -avz -e "${RSYNC_SSH}" ./personal/ "${DEST}personal/"
          if [[ -d design ]]; then
            rsync -avz -e "${RSYNC_SSH}" ./design/ "${DEST}design/"
          fi
          rsync -avz --exclude '.fred-api-key' -e "${RSYNC_SSH}" ./economics/ "${DEST}economics/"
          rsync -avz -e "${RSYNC_SSH}" ./incoming-hub/contact/ "${DEST}contact/"
          # --no-perms: avoid rsync exit 23 when remote cannot set mode 600 on secret files.
          rsync -rlvz --no-perms -e "${RSYNC_SSH}" ./incoming-hub/private/ "${DEST}private/"
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'chmod 600 incoming-hub/private/contact.env incoming-hub/private/fred-api-key incoming-hub/private/abs-indicator-api-key 2>/dev/null || true'
          mkdir -p ./incoming-mmd-staging/mmd
          cp ./scripts/valuation_fetch.py ./scripts/valuation_server.py ./scripts/multilateral_fetch.py ./scripts/aus_fetch.py ./incoming-mmd-staging/mmd/
          cp ./scripts/droplet/mmd-valuation.service ./incoming-mmd-staging/mmd/
          rsync -avz -e "${RSYNC_SSH}" ./incoming-mmd-staging/mmd/ "${DEST}mmd/"
          rm -rf ./incoming-mmd-staging
          rsync -avz -e "${RSYNC_SSH}" ./content/ "${DEST}content/"
          if [[ -d assets ]]; then
            rsync -avz -e "${RSYNC_SSH}" ./assets/ "${DEST}assets/"
          fi
          # Always ship the latest apply script so the droplet cannot drift.
          rsync -avz -e "${RSYNC_SSH}" ./scripts/droplet/anthemic-hub-deploy-apply.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/home/${DEPLOY_USER}/incoming-hub/anthemic-hub-deploy-apply.sh"

      - name: Validate upload contents on Droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          HUB_IN="/home/${DEPLOY_USER}/incoming-hub"
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test -f ${HUB_IN}/index.html && test -f ${HUB_IN}/bass/index.html && test -f ${HUB_IN}/brain/index.html && test -f ${HUB_IN}/hire/index.html && test -f ${HUB_IN}/hire/pitch.js && test -f ${HUB_IN}/content/pitch.json && test -f ${HUB_IN}/gigs/index.html && test -f ${HUB_IN}/gigs/gigs.json && test -f ${HUB_IN}/content/hub.json && test -f ${HUB_IN}/content/reading-list.seed.json && test -f ${HUB_IN}/personal/index.html && test -f ${HUB_IN}/personal/writing/index.html && test -f ${HUB_IN}/personal/writing/writing-desk.png && test -f ${HUB_IN}/economics/index.html && test -f ${HUB_IN}/mmd/valuation_server.py && test -f ${HUB_IN}/mmd/valuation_fetch.py && test -f ${HUB_IN}/mmd/aus_fetch.py" \
            || { echo "incoming-hub missing hub, bass, brain, gigs, content, reading-list.seed, or personal/ files after upload (expected under ${HUB_IN})"; exit 1; }

      - name: Apply on Droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          HUB_IN="/home/${DEPLOY_USER}/incoming-hub"
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "printf '%s\\n' '${HUB_IN}' > /tmp/anthemic-hub-incoming.path && chmod 644 /tmp/anthemic-hub-incoming.path && sudo /usr/local/bin/anthemic-hub-deploy-apply.sh"

      - name: Smoke test (hub + bass files on droplet)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          HUB_IN="/home/${DEPLOY_USER}/incoming-hub"
          code_root=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 2 "https://anthemic-developments.com/")
          [[ "${code_root}" == "200" ]] || { echo "Hub / returned HTTP ${code_root}"; exit 1; }
          curl -sS --retry 3 --retry-delay 2 "https://anthemic-developments.com/" -o /tmp/anthemic-smoke-hub.html
          grep -qF 'Anthemic Developments</title>' /tmp/anthemic-smoke-hub.html \
            || { echo "Hub page missing expected site name in <title>"; exit 1; }
          # Bass routing is nginx (anthemic-ops). Hub only guarantees files under /var/www/anthemic-hub/bass/.
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'test -f /var/www/anthemic-hub/bass/index.html' \
            || { echo "bass/index.html missing under /var/www/anthemic-hub/bass/ (reinstall apply script from repo; check incoming-hub/bass/ after upload)"; exit 1; }
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'grep -qF "Andy Pap — Bass" /var/www/anthemic-hub/bass/index.html' \
            || { echo "bass/index.html on droplet missing expected content marker"; exit 1; }
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'test -f /var/www/anthemic-hub/personal/writing/index.html' \
            || { echo "After apply, writing index missing (incoming: ${HUB_IN}). Install latest scripts/droplet/anthemic-hub-deploy-apply.sh to /usr/local/bin/ (uses /tmp/anthemic-hub-incoming.path)."; exit 1; }
          code_writing=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 2 "https://anthemic-developments.com/personal/writing/")
          [[ "${code_writing}" == "200" ]] || { echo "Writing holding page /personal/writing/ returned HTTP ${code_writing} (sync anthemic-ops nginx to droplet; verify sites-enabled -> sites-available/anthemic-hub)"; exit 1; }
          curl -sS --retry 3 --retry-delay 2 "https://anthemic-developments.com/personal/writing/" -o /tmp/anthemic-smoke-writing.html
          grep -qF 'Writing — coming soon' /tmp/anthemic-smoke-writing.html \
            || { echo "Writing page missing expected <title> marker"; exit 1; }
          code_hire=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 2 "https://anthemic-developments.com/hire/")
          [[ "${code_hire}" == "200" ]] || { echo "/hire/ returned HTTP ${code_hire}"; exit 1; }
          code_pitch=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 2 "https://anthemic-developments.com/content/pitch.json")
          [[ "${code_pitch}" == "200" ]] || { echo "/content/pitch.json returned HTTP ${code_pitch}"; exit 1; }
          curl -sS --retry 3 --retry-delay 2 "https://anthemic-developments.com/hire/" -o /tmp/anthemic-smoke-hire.html
          if grep -qF 'id="hero-name"' /tmp/anthemic-smoke-hire.html; then
            echo "/hire/ is serving the hub index — deploy anthemic-ops nginx (location ^~ /hire/)"
            exit 1
          fi
          grep -qF '<title>Why hire Andy Papadopoulos</title>' /tmp/anthemic-smoke-hire.html \
            || { echo "/hire/ page missing expected title marker"; exit 1; }
          mmd_health_ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'systemctl is-active --quiet mmd-valuation.service && curl -fsS --max-time 5 http://127.0.0.1:8071/health | grep -q "\"ok\""'; then
              mmd_health_ok=1
              break
            fi
            sleep 2
          done
          [[ "${mmd_health_ok}" == 1 ]] || {
            echo "mmd-valuation.service not healthy on loopback :8071 (check journalctl -u mmd-valuation)"
            ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'systemctl status mmd-valuation.service --no-pager; journalctl -u mmd-valuation.service -n 40 --no-pager' || true
            exit 1
          }
          code_fred_key=$(curl -sS -o /dev/null -w "%{http_code}" --retry 2 "https://anthemic-developments.com/economics/.fred-api-key")
          [[ "${code_fred_key}" == "404" ]] || { echo "economics/.fred-api-key must not be public (got HTTP ${code_fred_key})"; exit 1; }
          if curl -sS --retry 2 "https://anthemic-developments.com/bass/papaweb.config.js" | grep -q 'hooks.slack.com'; then
            echo "bass/papaweb.config.js must not expose Slack webhook URLs"
            exit 1
          fi
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "curl -fsS --max-time 10 -X POST http://127.0.0.1:8072/contact \
              -H 'Content-Type: application/json' \
              -H 'Origin: https://anthemic-developments.com' \
              -d '{\"name\":\"smoke\",\"email\":\"smoke@example.com\",\"message\":\"deploy smoke (ignore)\"}' \
            | grep -q '\"success\":true'" \
            || { echo "papaweb-contact.service loopback POST /contact failed (install node, check journalctl -u papaweb-contact)"; exit 1; }
