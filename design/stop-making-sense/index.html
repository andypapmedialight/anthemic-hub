<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stop Making Sense stage build · Design lab</title>
  <meta name="description" content="Scroll-driven stage build experiment inspired by Stop Making Sense — Anthemic design lab." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=figtree:400,500,600|fraunces:600,700&display=swap" />
  <link rel="stylesheet" href="sms.css" />
</head>
<body class="sms-page">
  <div class="sms-top">
    <a href="/design/">← Design lab</a>
    <span class="sms-top-title">Stop Making Sense</span>
    <a href="/">Hub</a>
  </div>

  <button type="button" class="sms-skip" id="sms-skip">Skip to full set</button>

  <main class="sms-scroller" id="sms-scroller">
    <div class="sms-pin" id="sms-pin">
      <div class="sms-void" aria-hidden="true"></div>
      <div class="sms-spot" id="sms-spot" aria-hidden="true"></div>

      <div class="sms-stage" role="img" aria-label="Concert stage being assembled as you scroll">
        <div class="sms-stage-inner">
          <div class="sms-hall" aria-hidden="true">
            <img class="sms-graphic" data-graphic="hall" src="graphics/hall.svg" alt="" width="480" height="320" decoding="async" />
          </div>

          <div class="sms-layer sms-prop sms-prop--backdrop from-back" data-sms-layer="backdrop" aria-hidden="true">
            <img class="sms-graphic" data-graphic="backdrop" src="graphics/backdrop.svg" alt="" width="480" height="280" decoding="async" />
          </div>

          <div class="sms-layer sms-prop sms-prop--floor from-floor" data-sms-layer="floor" aria-hidden="true">
            <img class="sms-graphic" data-graphic="floor" src="graphics/floor.svg" alt="" width="400" height="72" decoding="async" />
          </div>

          <div class="sms-layer sms-prop sms-prop--amp-l from-left" data-sms-layer="amp-l" aria-hidden="true">
            <img class="sms-graphic" data-graphic="amp-l" src="graphics/amp-stack.svg" alt="" width="88" height="200" decoding="async" />
          </div>
          <div class="sms-layer sms-prop sms-prop--amp-r from-right" data-sms-layer="amp-r" aria-hidden="true">
            <img class="sms-graphic sms-graphic--flip" data-graphic="amp-r" src="graphics/amp-stack.svg" alt="" width="88" height="200" decoding="async" />
          </div>

          <div class="sms-layer sms-prop sms-prop--drums from-back" data-sms-layer="drums" aria-hidden="true">
            <img class="sms-graphic" data-graphic="drums" src="graphics/drums.svg" alt="" width="220" height="160" decoding="async" />
          </div>

          <div class="sms-layer sms-prop sms-prop--keys from-left" data-sms-layer="keys" aria-hidden="true">
            <img class="sms-graphic" data-graphic="keys" src="graphics/keys.svg" alt="" width="160" height="120" decoding="async" />
          </div>

          <div class="sms-layer sms-prop sms-prop--bass from-right" data-sms-layer="bass" aria-hidden="true">
            <img class="sms-graphic" data-graphic="bass" src="graphics/bass.svg" alt="" width="100" height="180" decoding="async" />
          </div>

          <div class="sms-layer sms-prop sms-prop--guitar from-right" data-sms-layer="guitar" aria-hidden="true">
            <img class="sms-graphic" data-graphic="guitar" src="graphics/guitar.svg" alt="" width="90" height="200" decoding="async" />
          </div>

          <div class="sms-layer sms-prop sms-prop--vocal from-back" data-sms-layer="vocal" aria-hidden="true">
            <img class="sms-graphic" data-graphic="vocal" src="graphics/vocal.svg" alt="" width="120" height="220" decoding="async" />
          </div>

          <div class="sms-layer sms-prop sms-prop--lights from-back" data-sms-layer="lights" aria-hidden="true">
            <img class="sms-graphic" data-graphic="lights" src="graphics/lights.svg" alt="" width="480" height="120" decoding="async" />
          </div>

          <div class="sms-layer sms-prop sms-prop--cables from-floor" data-sms-layer="cables" aria-hidden="true">
            <img class="sms-graphic" data-graphic="cables" src="graphics/cables.svg" alt="" width="400" height="48" decoding="async" />
          </div>

          <div class="sms-layer sms-prop sms-prop--crowd from-floor" data-sms-layer="crowd" aria-hidden="true">
            <img class="sms-graphic" data-graphic="crowd" src="graphics/crowd.svg" alt="" width="480" height="80" decoding="async" />
          </div>

          <div class="sms-layer sms-fog" data-sms-layer="fog" aria-hidden="true"></div>
        </div>
      </div>

      <div class="sms-intro-overlay" id="sms-intro">
        <p>
          Scroll to build the set
          <span>Each step wheels something on — the scene stays fixed, like the film.</span>
        </p>
      </div>

      <div class="sms-hud" aria-live="polite">
        <p class="sms-hud-kicker">Now cueing</p>
        <p class="sms-hud-cue" id="sms-hud-cue">Empty hall. One spot.</p>
        <div class="sms-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="sms-progress">
          <span class="sms-progress-fill" id="sms-progress-fill"></span>
        </div>
        <div class="sms-steps" id="sms-step-dots" aria-hidden="true"></div>
      </div>
    </div>

    <div class="sms-scroll-spacer" id="sms-scroll-spacer" aria-hidden="true"></div>
  </main>

  <p class="sms-credits" id="sms-credits" hidden>
    Stage art from <a href="graphics/sources.json">Vecteezy / Freepik</a> — see
    <a href="graphics/ATTRIBUTION.md">attribution</a>.
  </p>
  <p class="sms-credits sms-credits--placeholder" id="sms-credits-placeholder">
    Using placeholder art.
    <a href="graphics/sources.json">Source Vecteezy / Freepik SVGs</a> →
    <code>graphics/vendor/</code>
  </p>

  <script src="sms-graphics.js" defer></script>
  <script src="sms.js" defer></script>
</body>
</html>
